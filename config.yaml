# config.yaml - Pulse pwsh_agent Configuration

ollama:
  # Legacy fallback — used when endpoints are not set; also canonical coder URL.
  base_url: "http://localhost:11435"

  # Multi-GPU endpoints (docker-compose.multi-gpu.yml)
  endpoints:
    intake:  "http://localhost:11436"
    planner: "http://localhost:11434"
    coder:   "http://localhost:11435"

  # Pin models resident per GPU — no unload between phase switches.
  unload_after_call: false

  # ── 5-phase model pipeline ────────────────────────────────────────────────
  # INTAKE   (chat-analyzer @ :11436): user msg → structured IntentSpec
  # PLAN     (vibethinker @ :11434):   IntentSpec → monologue → roadmap
  # VALIDATE (qwen-coder @ :11435):    Coder checks roadmap JSON
  # EXECUTE  (qwen-coder @ :11435):    tool_calls, code, strict syntax
  # EVALUATE (vibethinker @ :11434):   exec result → next step / done?
  # ─────────────────────────────────────────────────────────────────────────

  # EXECUTE phase: tool-calling, code, strict syntax
  default_model: "qwen2.5-coder:7b-instruct"

  # INTAKE phase: formalises user intention into structured IntentSpec
  conversational_model: "chat-analyzer"

  # PLAN + EVALUATE phase: leads the process, monologue, roadmap, evaluation
  planner_model: "vibethinker:3b"

  # Context window for the execute model
  num_ctx: 8192
  # Context window for the planner model (VibeThinker has 16k)
  num_ctx_planner: 16384

  num_predict: 3072
  num_predict_planner: 2048

agent:
  # Maximum steps in a single autonomous ReAct loop
  max_steps: 30

  # LEAD specialist prompt pack (4-file contract with token budgets)
  prompt_pack_mode: true
  prompt_budgets:
    agents_tokens: 1000
    soul_tokens: 500
    tools_tokens: 1000
    current_state_tokens: 1500
  specialist_soft_scope: true
  session_fence_mode: true

  # Thought budget limit for the sequentialthinking tool
  max_thoughts: 30

  # Trimmed persisted history budget (chars); aligned with ollama.num_ctx (8192)
  max_context_chars: 30000
  max_context_tokens: 8192
  reserve_generation_tokens: 3072
  # ~injection_budget_chars (8000) at 4 chars/token, plus CURRENT STATE headroom
  reserve_injection_tokens: 2400
  max_total_messages: 80
  max_tool_result_chars: 22000
  injection_budget_chars: 8000
  # Phase 2: recent raw turns sent to the LLM each step. Full history stays on
  # disk for audit; CURRENT STATE carries durable continuity. 0 = send all.
  history_window_turns: 8

  # LLM I/O audit (state/sessions/<id>/llm_audit.jsonl):
  #   full — entire message array + tools schema + response (debug missions)
  #   meta — roles/lengths/token counts only (daily default, avoids quadratic logs)
  #   off  — disabled
  # Validated 2026-06-10 with full; meta is the daily default.
  llm_audit: meta

intent:
  # INTAKE phase: chat-analyzer formalises the user message into IntentSpec (JSON).
  # shadow_mode=false → spec drives planning bootstrap, hygiene RAG gating, and VT roadmap.
  shadow_mode: false
  use_llm: true
  # Intake model: defaults to ollama.conversational_model (chat-analyzer)
  model: null
  temperature: 0.1
  inject_context: true

planner:
  # PLAN + EVALUATE phase — VibeThinker leads the process.
  monologue_enabled: true
  monologue_max_tokens: 512
  reevaluate_on: ["start", "failure", "warning", "exec_result"]
  temperature: 0.4
  validate_temperature: 0.1
  validate_enabled: true
  validate_max_retries: 1
  parallel_branches: true
  max_parallel_branches: 2

handoff:
  # Workspace specialist may run this many in-scope tools before auto-return to LEAD.
  max_tools_per_delegate: 4

checkpoint:
  # profile: interactive — all triggers may pause for user input
  # profile: headless — skips stall_recovery and exec_result_review (autonomous harness)
  profile: headless
  # User checkpoint: blocks execution and asks the user for direction.
  # The user can answer once or whitelist "always continue in this case".
  enabled: true
  # Trigger types that pause and ask the user
  triggers:
    - needs_readaptation    # a roadmap step FAILED
    - stall_recovery        # 3+ non-substantive tools in a row
    - attempt_cap_reached   # step BLOCKED after 8 failed attempts
    - exec_result_review    # after every code/script execution result
  # Persist whitelist decisions: {trigger_type: "always_continue" | "always_ask"}
  whitelist_file: "state/checkpoint_whitelist.json"

console:
  # Multiline submit binding. Options: "ctrl-enter", "esc-enter", "enter"
  submit_binding: "ctrl-enter"

hygiene_eyes:
  feed_dir: "C:/Users/soyko/Documents/Libraries/hygiene-feed"
  poll_missions: true
  poll_interval_seconds: 120

rag:
  extra_dirs:
    - "C:/Users/soyko/Documents/Libraries/hygiene-feed"
